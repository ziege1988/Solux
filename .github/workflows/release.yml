# Baut Solux auf einem Mac-Runner und veröffentlicht ein GitHub-Release.
# Auslöser:
#  - ein Tag wie v1.0.1 (git tag v1.0.1 && git push origin v1.0.1)
#  - oder manuell über „Run workflow“: mit „release“ = true wird die Version aus package.json
#    als Release (Tag v<version>) veröffentlicht, sonst nur als Download-Artefakt gebaut.
name: Solux bauen

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Als Release veröffentlichen (Version aus package.json)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Version bestimmen
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            npm version --no-git-tag-version --allow-same-version "$V"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: App bauen (Apple Silicon + Intel)
        run: npx electron-builder --mac zip dmg --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Solux-mac
          path: |
            dist/*.zip
            dist/*.dmg
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Solux ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/*.dmg
          generate_release_notes: true
