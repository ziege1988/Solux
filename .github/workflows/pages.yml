# Veröffentlicht die Handy-Version (Web-App) auf GitHub Pages.
# Läuft bei jeder Änderung an Oberfläche oder gemeinsamem Code, oder manuell.
name: Solux mobil veröffentlichen

on:
  push:
    branches: [claude/solux-mac-sun-widget-f63z9q, main]
    paths: ['web/**', 'src/shared/**', 'src/renderer/widget.*', 'src/renderer/common.js', 'src/renderer/base.css', 'scripts/build-web.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/*.test.js
      - run: node scripts/build-web.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@v4
