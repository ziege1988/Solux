<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Solux</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; animation: in .7s ease-out both, out .5s ease-in 2.05s forwards; }
  @keyframes in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes out { to { opacity: 0; transform: scale(1.03); } }
  @media (prefers-reduced-motion: reduce) { canvas { animation: none; } }
</style>
</head>
<body>
<canvas id="cv" width="760" height="760"></canvas>
<script src="common.js"></script>
<script src="splash.js"></script>
</body>
</html>
